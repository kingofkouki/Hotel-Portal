<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaky iOS Hotel Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="authScreen" class="auth-screen" aria-labelledby="authTitle">
        <form id="loginForm" class="auth-card">
            <div class="auth-icon" aria-hidden="true">🏨</div>
            <h1 id="authTitle">QIN Hotel Portal</h1>
            <p>Masuk menggunakan akun yang diberikan administrator.</p>
            <label class="form-group">
                <span>Username</span>
                <input id="loginUsername" class="form-control" type="text" autocomplete="username" maxlength="50" required>
            </label>
            <label class="form-group">
                <span>Password</span>
                <input id="loginPassword" class="form-control" type="password" autocomplete="current-password" required>
            </label>
            <p id="loginMessage" class="auth-message" role="alert" aria-live="polite"></p>
            <button id="loginButton" class="btn-primary" type="submit">Masuk</button>
        </form>
    </section>

    <div id="portalShell" class="portal-shell" hidden>
    <!-- Sidebar Navigasi -->
    <div class="sidebar">
        <div class="sidebar-brand">
            🏨 QIN PORTAL
        </div>

        <nav class="menu-navigation" aria-label="Main navigation">
            <button class="menu-btn" data-module="dashboard" aria-label="Data Dashboard" title="Data Dashboard" onclick="loadModule('dashboard', event, 'Data Dashboard')"><span class="menu-icon" aria-hidden="true">📊</span><span class="menu-label">Data Dashboard</span></button>
            <div class="menu-category">Operasional Harian</div>
            <button class="menu-btn active" data-module="shift-log" aria-label="Shift Handover Log" title="Shift Handover Log" onclick="loadModule('shift-log', event, 'Shift Handover Log')"><span class="menu-icon" aria-hidden="true">📋</span><span class="menu-label">Shift Handover Log</span></button>
            <button class="menu-btn" data-module="room-status" aria-label="Room Status Check" title="Room Status Check" onclick="loadModule('room-status', event, 'Room Status Check')"><span class="menu-icon" aria-hidden="true">🛏️</span><span class="menu-label">Room Status Check</span></button>
            <button class="menu-btn" data-module="lost-found" aria-label="Lost & Found" title="Lost & Found" onclick="loadModule('lost-found', event, 'Lost & Found')"><span class="menu-icon" aria-hidden="true">🔍</span><span class="menu-label">Lost & Found</span></button>
            
            <div class="menu-category">Fasilitas & Pemeliharaan</div>
            <button class="menu-btn" data-module="maintenance" aria-label="Maintenance Request" title="Maintenance Request" onclick="loadModule('maintenance', event, 'Maintenance Request')"><span class="menu-icon" aria-hidden="true">🛠️</span><span class="menu-label">Maintenance Request</span></button>
            <button class="menu-btn" data-module="settings" aria-label="Settings" title="Settings" onclick="loadModule('settings', event, 'Settings')"><span class="menu-icon" aria-hidden="true">⚙️</span><span class="menu-label">Settings</span></button>
        </nav>
        
        <!-- Tambahkan menu modul lainnya di sini nanti -->
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="header-top">
            <h1 id="pageTitle">Shift Handover Log</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">🌙 Dark mode</button>
                <div class="user-profile">👋 <span id="signedInUser"></span></div>
                <button class="theme-toggle" id="logoutButton" type="button">Log out</button>
            </div>
        </div>

        <!-- Kotak Dinamis tempat file HTML modul luar akan dimuat secara otomatis -->
        <div id="moduleContainer">
            <!-- Konten modul akan dirender di sini oleh JavaScript -->
        </div>
    </div>

    <!-- iOS Toast Notification Pop-up di Tengah -->
    <div id="toastNotification">
        <h4 id="toastTitle">Berhasil</h4>
        <p id="toastMessage">Data berhasil dikirim ke Google Sheets.</p>
    </div>

    <!-- Apps Script HTML Service uses these embedded templates instead of public module fetches. -->
    <!-- Apps Script module templates are generated by apps-script/BuildPortal.ps1. -->
    <!-- Script Utama (Router & Helper) -->
    <script src="js/app.js"></script>
    <!-- Script Fungsi Khusus Modul -->
    <script src="js/modul.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/room-status.js"></script>
</body>
</html>
